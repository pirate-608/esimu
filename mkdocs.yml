site_name: esimu
site_description: A theme-driven framework for building single-theme narrative simulators.
site_url: https://esimu.67656.fun/
repo_url: https://github.com/pirate-608/esimu
repo_name: pirate-608/esimu
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

nav:
  - English:
      - Home: index.md
      - Start Here:
          - Quickstart: quickstart.md
          - CLI Reference: cli.md
          - Bootstrap A Project: new-project-bootstrap.md
          - Starter App Shape: starter-app-shape.md
          - Starter Contract: starter-contract.md
          - AI Integration: ai-integration.md
      - Framework:
          - Architecture: architecture.md
          - Theme Pack Contract: theme-pack-contract.md
          - Roadmap: roadmap.md
          - Readiness Review: framework-readiness-review.md
          - Release Policy: release-policy.md
          - Beta Support: beta-support.md
      - Maintainers:
          - Agent Handoff: agent-handoff.md
  - 中文:
      - 首页: zh/index.md
      - 开始使用:
          - 快速开始: zh/quickstart.md
          - CLI 参考: zh/cli.md
          - 创建新项目: zh/new-project-bootstrap.md
          - Starter 形态: zh/starter-app-shape.md
          - Starter 契约: zh/starter-contract.md
          - AI 集成: zh/ai-integration.md
      - 框架:
          - 架构: zh/architecture.md
          - 主题包契约: zh/theme-pack-contract.md
          - 路线图: zh/roadmap.md
          - 就绪审查: zh/framework-readiness-review.md
          - 发布策略: zh/release-policy.md
          - Beta 支持: zh/beta-support.md
      - 维护者:
          - Agent 交接: zh/agent-handoff.md

markdown_extensions:
  - admonition
  - fenced_code
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: 中文
      link: /zh/
      lang: zh
