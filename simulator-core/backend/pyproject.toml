[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "esimu-core"
description = "Reusable backend core for the esimu simulator framework lab."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "pirate-608" },
]
keywords = ["simulation", "game", "framework", "theme-pack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
]
dynamic = ["version"]

[project.scripts]
esimu-validate-world = "esimu_core.cli:validate_world"

[project.optional-dependencies]
ai = [
    "openai>=1.12",
]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/pirate-608/esimu-lab"
Repository = "https://github.com/pirate-608/esimu-lab"
Issues = "https://github.com/pirate-608/esimu-lab/issues"

[tool.setuptools.packages.find]
include = ["esimu_core*"]

[tool.setuptools.package-data]
esimu_core = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "esimu_core.__version__" }

[tool.ruff]
line-length = 88
target-version = "py311"
