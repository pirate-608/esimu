name: publish TestPyPI candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Check scaffold bundle
        run: python packages/esimu-core/scripts/sync_scaffold_bundle.py
      - name: Build and inspect distributions
        run: |
          python -m build packages/esimu-core
          python -m twine check packages/esimu-core/dist/*
      - name: Run artifact-to-consumer smoke
        run: python packages/esimu-core/scripts/release_smoke.py
      - name: Publish to TestPyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: packages/esimu-core/dist/

