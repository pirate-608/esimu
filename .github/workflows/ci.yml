name: esimu ci

on:
  push:
    branches: [main]
    tags: ["esimu-core-v*"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core
        working-directory: packages/esimu-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run core tests
        working-directory: packages/esimu-core
        run: python -m pytest tests
      - name: Run core lint
        working-directory: packages/esimu-core
        run: python -m ruff check esimu_core scripts tests
      - name: Validate default theme
        working-directory: packages/esimu-core
        run: python scripts/validate_world_data.py
      - name: Validate demo theme
        working-directory: packages/esimu-core
        env:
          ESIMU_THEME: demo-campus
        run: python scripts/validate_world_data.py
      - name: Check packaged Starter bundle
        run: python packages/esimu-core/scripts/sync_scaffold_bundle.py

  starter:
    name: starter backend
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install starter backend
        working-directory: apps/starter/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run starter tests
        working-directory: apps/starter/backend
        run: python -m pytest tests
      - name: Run starter lint
        working-directory: apps/starter/backend
        run: python -m ruff check app tests

  starter-frontend:
    name: starter frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          cache: true
          cache_dependency_path: apps/starter/frontend/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install starter frontend
        working-directory: apps/starter/frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck starter frontend
        working-directory: apps/starter/frontend
        run: pnpm typecheck
      - name: Test starter frontend
        working-directory: apps/starter/frontend
        run: pnpm test
      - name: Build starter frontend
        working-directory: apps/starter/frontend
        run: pnpm build

  release-smoke:
    name: external install smoke
    runs-on: ubuntu-latest
    needs: [core, starter, starter-frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install release build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and run generated project
        run: python packages/esimu-core/scripts/release_smoke.py

  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      - name: Guard default docs and starter against ZJU-specific visible names
        run: |
          python - <<'PY'
          from pathlib import Path

          needles = ("浙江大学", "折姜", "折大", "钉钉", "CC98")
          roots = [Path("apps/starter"), Path("docs/index.md"), Path("docs/zh/index.md")]
          hits = []
          for root in roots:
              files = root.rglob("*") if root.is_dir() else [root]
              for path in files:
                  if path.is_file() and path.suffix in {".py", ".ts", ".tsx", ".vue", ".js", ".md", ".html"}:
                      text = path.read_text(encoding="utf-8", errors="ignore")
                      for needle in needles:
                          if needle in text:
                              hits.append(f"{path}: {needle}")
          if hits:
              print("Default starter/docs path should not expose ZJU reference names.")
              print("\n".join(hits))
              raise SystemExit(1)
          PY
      - name: Build docs
        run: zensical build
